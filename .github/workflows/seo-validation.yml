name: SEO validation

on:
  push:
    branches:
      - "seo/**"
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate portfolio pages
        run: python scripts/generate.py
      - name: Build CSS
        run: npm run build
      - name: Validate pages, links, sitemap and structured data
        run: python scripts/validate.py
      - name: Commit regenerated static pages on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Generated site is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(seo): regenerate static portfolio pages"
            git push
          fi
