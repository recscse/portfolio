      const grid = document.getElementById('projects-grid');
      const filterBtns = document.querySelectorAll('.filter-btn');

      function renderProjects(filter) {
          grid.innerHTML = '';
          const filtered = filter === 'all' 
            ? projects 
            : projects.filter(p => p.category.includes(filter));
          
          filtered.forEach(p => {
              let statusClass = 'status-live';
              let displayStatus = p.status || 'Live';
              if(displayStatus === 'WIP') statusClass = 'status-wip';
              if(displayStatus === 'Archived') statusClass = 'status-archived';

              const card = document.createElement('article');
              card.className = 'card project-card fade-in visible';
              if (p.repo) card.setAttribute('data-repo', p.repo);
              
              card.innerHTML = `
                <div class="project-header" style="justify-content: space-between; align-items: flex-start;">
                   <div style="display:flex; align-items:center; gap:12px;">
                       <i class='bx ${p.icon} project-icon'></i>
                       <h3 style="font-size: 1.4rem;">${p.title}</h3>
                   </div>
                   <span class="status-badge ${statusClass}">${displayStatus}</span>
                </div>
                <p class="project-description" style="margin-top: 10px; font-weight: 500; color: var(--text-main);">${p.description}</p>
                
                <span class="details-label">Key Highlights</span>
                <ul class="highlights">
                    ${p.highlights.map(h => `<li>${h}</li>`).join('')}
                </ul>

                <div class="tags" style="margin-top: 16px;">
                    ${p.tags.map(t => `<span>${t}</span>`).join('')}
                </div>

                ${p.downloads || p.install ? `
                <div class="package-meta">
                    ${p.downloads ? `<span><i class='bx bx-download'></i> ${p.downloads}</span>` : ''}
                    ${p.install ? `<code>${p.install}</code>` : ''}
                </div>` : ''}
                
                <div class="project-links" style="margin-top: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <a class="btn primary" href="${p.link}" target="_blank" style="flex: 1; justify-content: center;">
                        <i class='bx ${p.link.includes('blog') ? 'bx-book-content' : 'bxl-github'}'></i> 
                        ${p.link.includes('blog') ? 'Read Case Study' : 'Source Code'}
                    </a>
                    ${p.pypi ? `
                    <a class="btn" href="${p.pypi}" target="_blank" style="flex: 1; justify-content: center;">
                        <i class='bx bxl-python'></i> PyPI
                    </a>` : ''}
                    ${p.docs ? `
                    <a class="btn" href="${p.docs}" target="_blank" style="flex: 1; justify-content: center;">
                        <i class='bx bx-book-open'></i> Docs
                    </a>` : ''}
                    ${p.demo && p.demo !== '#' ? `
                    <a class="btn" href="${p.demo}" target="_blank" style="flex: 1; justify-content: center;">
                        <i class='bx bx-link-external'></i> Live Demo
                    </a>` : ''}
                    ${p.repo ? `
                    <div class="repo-stats" style="display: flex; gap: 10px; align-items: center; font-size: 0.8rem; color: var(--text-muted); background: rgba(255,255,255,0.03); padding: 5px 12px; border-radius: 99px; border: 1px solid var(--glass-border);">
                        <span class="stat-item"><i class="bx bx-star"></i> <span class="stars-count">--</span></span>
                        <span class="stat-item"><i class="bx bx-git-commit"></i> <span class="last-commit">--</span></span>
                    </div>` : ''}
                </div>
              `;
              grid.appendChild(card);
          });
          fetchGitHubStats();
      }

      async function fetchGitHubStats() {
          const cards = document.querySelectorAll('[data-repo]');
          for (const card of cards) {
              const repo = card.getAttribute('data-repo');
              if (!repo || repo.includes('project-repo')) continue;

              try {
                  const response = await fetch(`https://api.github.com/repos/${repo}`);
                  if (!response.ok) throw new Error('Repo not found');
                  const data = await response.json();
                  
                  const starsEl = card.querySelector('.stars-count');
                  const commitEl = card.querySelector('.last-commit');
                  
                  if (starsEl) starsEl.textContent = data.stargazers_count;
                  if (commitEl) {
                      const date = new Date(data.updated_at);
                      commitEl.textContent = date.toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
                      commitEl.parentElement.title = `Last updated: ${date.toLocaleString()}`;
                  }
              } catch (err) {
                  console.error(`Error fetching stats for ${repo}:`, err);
              }
          }
      }

      filterBtns.forEach(btn => {
          btn.addEventListener('click', () => {
              filterBtns.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              renderProjects(btn.dataset.filter);
          });
      });

      renderProjects('all');

      const themeBtn = document.getElementById('theme-toggle');
      const sunIcon = themeBtn.querySelector('.sun-icon');
      const moonIcon = themeBtn.querySelector('.moon-icon');

      function updateIcons(theme) {
          if (theme === 'light') {
              sunIcon.style.display = 'none';
              moonIcon.style.display = 'block';
          } else {
              sunIcon.style.display = 'block';
              moonIcon.style.display = 'none';
          }
      }
      
      const currentTheme = document.documentElement.getAttribute('data-theme');
      updateIcons(currentTheme);

      themeBtn.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          updateIcons(next);
      });

      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
