<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found | Brijesh Yadav</title>
    <link rel="stylesheet" href="mystyle.css" />
    <meta name="robots" content="noindex, follow" />
    <script>
      const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', savedTheme);

  </head>
  <body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between;">
    <nav class="nav-bar">

      <h1 style="font-size: 5rem; font-family: var(--font-mono); color: var(--primary); margin-bottom: 16px;">404</h1>
      <h2 style="font-size: 1.8rem; margin-bottom: 16px;">Page Not Found</h2>

      <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">

      document.getElementById('year').textContent = new Date().getFullYear();

</html>
